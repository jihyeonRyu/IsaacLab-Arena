# Evaluate each task cardinality separately so success rate is reported for
# one-, two-, and three-blue-cube episodes instead of hiding the hard cases in
# one aggregate number.
# Synthetic generation uses seed 50007 + episode_index (50007..50606 for the
# 600-attempt run). Keep evaluation RNG streams outside that range.
runs:
  franka_blue_tray_1_cube:
    environment:
      type: blue_cube_tray
      enable_cameras: true
      num_blue_cubes: 1
      num_red_cubes: 2
      cube_size_range: [0.05, 0.05]
    environment_builder:
      num_envs: 1
      solve_relations: false
      seed: 10007
      language_instruction: Pick up every blue cube and place it in the green tray. Ignore the red cubes.
    policy: &franka_eef_policy
      type: isaaclab_arena_gr00t.policy.franka_eef_remote_policy.FrankaEefRemotePolicy
      policy_device: cpu
      remote_host: 127.0.0.1
      remote_port: 5555
      action_horizon: 16
      action_chunk_length: 16
      policy_hz: 15
      control_hz: 60
      interpolate_actions: true
      max_translation_action: 0.0375
      max_rotation_action: 0.0666667
    rollout_limit:
      num_episodes: 10

  franka_blue_tray_2_cubes:
    environment:
      type: blue_cube_tray
      enable_cameras: true
      num_blue_cubes: 2
      num_red_cubes: 2
      cube_size_range: [0.05, 0.05]
    environment_builder:
      num_envs: 1
      solve_relations: false
      seed: 20007
      language_instruction: Pick up every blue cube and place it in the green tray. Ignore the red cubes.
    policy: *franka_eef_policy
    rollout_limit:
      num_episodes: 10

  franka_blue_tray_3_cubes:
    environment:
      type: blue_cube_tray
      enable_cameras: true
      num_blue_cubes: 3
      num_red_cubes: 2
      cube_size_range: [0.05, 0.05]
    environment_builder:
      num_envs: 1
      solve_relations: false
      seed: 30007
      language_instruction: Pick up every blue cube and place it in the green tray. Ignore the red cubes.
    policy: *franka_eef_policy
    rollout_limit:
      num_episodes: 10
